services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: delivery_erp
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]

  # Real Odoo. It is NOT started by a plain `docker compose up -d` (it needs RAM),
  # only when you ask for it by name: `docker compose up -d odoo`. See the README.
  # It reuses the Postgres above and creates its own separate database called "odoo".
  odoo:
    image: odoo:17.0
    profiles: ["odoo"]
    depends_on: [postgres]
    ports: ["8069:8069"]
    environment:
      HOST: postgres
      USER: delivery
      PASSWORD: delivery
    volumes: [odoo-data:/var/lib/odoo]

volumes:
  pgdata:
  odoo-data:
